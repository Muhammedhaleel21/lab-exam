<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">
	
Algorithm

1. Import pandas for loading and handling the dataset.


2. Import numpy for numerical operations.


3. Import matplotlib.pyplot for data visualization.


4. Import train_test_split to divide the dataset into training and testing sets.


5. Import LinearRegression, Ridge and Lasso to create regression models.


6. Import mean_squared_error and r2_score to evaluate model performance.


7. Load the Diabetes dataset using pd.read_csv().


8. Separate the input features (X) and target variable (y).


9. Split the dataset into 80% training data and 20% testing data using train_test_split().


10. Create and train the Linear Regression model using fit().


11. Predict the output using predict() and calculate MSE and R² score.


12. Create Ridge Regression models using alpha values 0.1, 1 and 10, train them and evaluate their performance.


13. Create Lasso Regression models using alpha values 0.1, 1 and 10, train them and evaluate their performance.


14. Create Linear, Ridge and Lasso models again using selected alpha values and train them with the training data.


15. Predict the test outputs using all three models.


16. Create a figure using plt.figure(figsize=(12,4)) to set the overall graph size.


17. Use plt.subplot(1,3,1), plt.subplot(1,3,2) and plt.subplot(1,3,3) to arrange three plots in one row.


18. Use plt.scatter() to create scatter plots comparing actual values with predicted values for each regression model.


19. Use plt.xlabel() and plt.ylabel() to label the X-axis as Actual and Y-axis as Predicted.


20. Use plt.title() to give a separate title to each regression plot.


21. Use plt.tight_layout() to automatically adjust the spacing between the plots.


22. Display all three graphs using plt.show().


23. Stop the program.


</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
