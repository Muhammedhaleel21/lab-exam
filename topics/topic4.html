<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">#include <stdio.h>

struct Process {
    int pid, at, bt;
};

void copyBT(int dest[], int src[], int n) {

    for(int i = 0; i < n; i++) {
        dest[i] = src[i];
    }
}

float RR(struct Process p[], int n, int originalBT[], int quantum) {

    int remaining[n];

    int time = 0, done = 0;

    float totalWT = 0;

    copyBT(remaining, originalBT, n);

    while(done < n) {

        int executed = 0;

        for(int i = 0; i < n; i++) {

            if(p[i].at <= time && remaining[i] > 0) {

                int exec;

                if(remaining[i] > quantum)
                    exec = quantum;
                else
                    exec = remaining[i];

                remaining[i] -= exec;

                time += exec;

                executed = 1;

                if(remaining[i] == 0) {

                    done++;

                    int tat = time - p[i].at;

                    int wt = tat - originalBT[i];

                    totalWT += wt;
                }
            }
        }

        if(!executed)
            time++;
    }

    return totalWT / n;
}

int main() {

    int n;

    int quantum;

    printf("Enter number of processes: ");
    scanf("%d", &n);

    struct Process p[n];

    int originalBT[n];

    for(int i = 0; i < n; i++) {

        p[i].pid = i + 1;

        printf("\nProcess P%d\n", i + 1);

        printf("Arrival Time: ");
        scanf("%d", &p[i].at);

        printf("Burst Time: ");
        scanf("%d", &p[i].bt);

        originalBT[i] = p[i].bt;
    }

    printf("\nEnter Time Quantum: ");
    scanf("%d", &quantum);

    float avgWT = RR(p, n, originalBT, quantum);

    printf("\nAverage Waiting Time = %.2f\n", avgWT);

    return 0;
}</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
