<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">
	
	
Algorithm: MLE and MAP using Multinomial Naive Bayes

Step 1: Start the program.

Step 2: Import the required libraries.

Import Pandas for handling the dataset.

Import train_test_split for splitting the dataset.

Import CountVectorizer for text vectorization.

Import MultinomialNB for Naive Bayes classification.

Import accuracy_score for calculating accuracy.


Step 3: Load the dataset.

Load the 20 Newsgroups dataset using the read_csv() function.

Step 4: Select the required categories.

Select the following four categories:

alt.atheism

soc.religion.christian

comp.graphics

sci.med


Step 5: Filter the dataset.

Use the isin() function to filter the dataset and select only the records belonging to the four selected categories.

Step 6: Separate features and labels.

Assign the text column to X (input features).

Assign the category column to y (target labels).


Step 7: Split the dataset.

Divide the dataset into training and testing data using train_test_split().

80% for training.

20% for testing.

Set random_state = 9 to obtain reproducible results.


Step 8: Perform text vectorization.

Create a CountVectorizer() object to convert text documents into numerical vectors by counting the occurrence of words.

Step 9: Fit and transform training data.

Use fit_transform() to learn the vocabulary from the training data and convert the text into numerical vectors.

Step 10: Transform testing data.

Use transform() to convert the testing data into numerical vectors using the vocabulary learned from the training data.

Step 11: Apply MLE (Maximum Likelihood Estimation).

Create a Multinomial Naive Bayes classifier with alpha = 0.0.

MLE estimates the probabilities using only the observed training data.

Train the MLE model using fit().


Step 12: Apply MAP (Maximum A Posteriori).

Create another Multinomial Naive Bayes classifier with alpha = 1.0.

MAP considers prior information along with the observed training data.

Train the MAP model using fit().


Step 13: Predict the results.

Use the predict() function to predict the categories of the testing data using both MLE and MAP models.

Step 14: Calculate MLE accuracy.

Use accuracy_score() to compare the actual testing labels with the predicted labels of the MLE model.

Step 15: Calculate MAP accuracy.

Use accuracy_score() to compare the actual testing labels with the predicted labels of the MAP model.

Step 16: Display the results.

Print and display the accuracy of both MLE and MAP models.

Step 17: Compare the results.

Compare the accuracy values of MLE and MAP to understand their classification performance.

Step 18: Stop the program.


</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
