<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int lru(int ref[], int n, int frames){
	int f[10], timeArr[10];
	int faults=0, t=0;

	for(int i=0; i<frames; i++){
		f[i] = -1;
		timeArr[i] = 0;
	}
	
	for(int i=0; i<n; i++){
		int found = -1;

		for(int j=0; j<frames; j++){
			if(f[j] == ref[i]){
				found = j;
				break;
			}
		}

		if(found != -1){
			timeArr[found] = ++t;
		}else{
			int pos=0;
			
			for(int j=1; j<frames; j++){
				if(timeArr[j] < timeArr[pos]){
					pos = j;
				}
			}

			f[pos] = ref[i];
			timeArr[pos] = ++t;
			faults++;
		}
	}

	return faults;
}

int main(int argc, char *argv[]){
	if(argc != 3){
		printf("Usage: %s <length> <frames>", argv[0]);
		return 0;
	}

	int n = atoi(argv[1]);
	int frames = atoi(argv[2]);
	
	int ref[100];
	srand(time(NULL));

	printf("Reference String:\n");
	for(int i=0; i<n; i++){
		ref[i] = rand() % 10;
		printf("%d ", ref[i]);
	}

	printf("/LRU Faults = %d", lru(ref, n, frames));

	return 0;
}</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
