<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">
   
    
from sklearn.datasets import fetch_20newsgroups
from sklearn.feature_extraction.text import CountVectorizer
import numpy as np

# Select two categories
categories = ['alt.atheism', 'soc.religion.christian']

# Load dataset
newsgroups = fetch_20newsgroups(
    subset='train',
    categories=categories
)

# Convert text into word counts
vectorizer = CountVectorizer(stop_words='english')
X = vectorizer.fit_transform(newsgroups.data)

# Select one category
category = 'alt.atheism'
category_index = newsgroups.target_names.index(category)

# Get word counts for selected category
X_category = X[newsgroups.target == category_index]

word_counts = np.asarray(X_category.sum(axis=0)).flatten()

# Vocabulary
words = vectorizer.get_feature_names_out()

# Total word count
total_words = word_counts.sum()
vocab_size = len(words)

# MLE probabilities
mle_prob = word_counts / total_words

print("MLE Word Probabilities:")
for word in ['god', 'religion', 'atheism', 'people']:
    index = np.where(words == word)[0]
    if len(index) > 0:
        print(word, ":", mle_prob[index[0]])

# MAP probabilities using Dirichlet priors
for alpha in [0.5, 1, 2]:

    map_prob = (word_counts + alpha) / (
        total_words + alpha * vocab_size
    )

    print("\nMAP Probabilities (alpha =", alpha, "):")

    for word in ['god', 'religion', 'atheism', 'people']:
        index = np.where(words == word)[0]
        if len(index) > 0:
            print(word, ":", map_prob[index[0]])


</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
