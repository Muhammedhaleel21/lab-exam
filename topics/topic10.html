<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">#include <stdio.h>
#include <unistd.h>
#include <math.h>
#include <sys/types.h>

int main() {

    int fd[2];
    pid_t pid;

    double a, b, c;
    double four_ac, b2, result, discriminant;

    printf("Enter values of a, b, c: ");
    scanf("%lf %lf %lf", &a, &b, &c);

    if(pipe(fd) == -1) {
        perror("Pipe failed");
        return 1;
    }

    pid = fork();

    if(pid < 0) {
        perror("Fork failed");
        return 1;
    }

    else if(pid == 0) {

        close(fd[0]);

        four_ac = 4 * a * c;

        write(fd[1], &four_ac, sizeof(four_ac));

        close(fd[1]);
    }

    else {

        close(fd[1]);

        b2 = b * b;

        read(fd[0], &four_ac, sizeof(four_ac));

        close(fd[0]);

        discriminant = b2 - four_ac;

        if(discriminant < 0) {

            printf("Discriminant (b^2 - 4ac) = %lf is NEGATIVE.\n", discriminant);

            printf("Square root of a negative number is imaginary. Cannot compute real value.\n");
        }

        else {

            result = sqrt(discriminant);

            printf("Value of sqrt(b^2 - 4ac) = %lf\n", result);
        }
    }

    return 0;
}</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
