<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">
    
from sklearn.model_selection import train_test_split
from sklearn.feature_extraction.text import CountVectorizer
from sklearn.naive_bayes import MultinomialNB, BernoulliNB
from sklearn.metrics import accuracy_score, f1_score
import pandas as pd

# Load dataset
data = pd.read_csv("/content/20NewsGroups1.csv")

# Select 4 categories
categories = ['sci.space', 'rec.autos',
              'comp.graphics', 'talk.politics.misc']

filtered_data = data[data['category'].isin(categories)]

x = filtered_data['text']
y = filtered_data['category']

# Split dataset
x_train, x_test, y_train, y_test = train_test_split(
    x, y, test_size=0.2, random_state=42, stratify=y
)

# Multinomial Vectorizer
vec_multi = CountVectorizer()
X_train_m = vec_multi.fit_transform(x_train)
X_test_m = vec_multi.transform(x_test)

# Bernoulli Vectorizer
vec_bern = CountVectorizer(binary=True)
X_train_b = vec_bern.fit_transform(x_train)
X_test_b = vec_bern.transform(x_test)

# Train models
m_nb = MultinomialNB().fit(X_train_m, y_train)
b_nb = BernoulliNB().fit(X_train_b, y_train)

# Predictions
m_pred = m_nb.predict(X_test_m)
b_pred = b_nb.predict(X_test_b)

# Compare Accuracy and F1-score
print("Multinomial Naive Bayes")
print("Accuracy:", accuracy_score(y_test, m_pred))
print("F1 Score:", f1_score(y_test, m_pred, average='macro'))

print("\nBernoulli Naive Bayes")
print("Accuracy:", accuracy_score(y_test, b_pred))
print("F1 Score:", f1_score(y_test, b_pred, average='macro'))

# Predict a new sentence
new_text = ["NASA is planning a new mission to explore Mars and space."]

new_m = vec_multi.transform(new_text)
new_b = vec_bern.transform(new_text)

print("\nNew Sentence Prediction")
print("Multinomial Prediction:", m_nb.predict(new_m)[0])
print("Bernoulli Prediction:", b_nb.predict(new_b)[0])

</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
