<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">
    
1. Explain OSI Reference Model.
The OSI model explains network communication using seven layers: Physical, Data Link, Network, Transport, Session, Presentation, and Application.

2. Brief idea of HTTP.
HTTP stands for Hypertext Transfer Protocol. It is used to transfer web pages and data between web browsers and web servers.

3. Explain DNS.
DNS stands for Domain Name System. It converts domain names like google.com into IP addresses.

4. Compare LAN, MAN, WAN.
LAN covers a small area, MAN covers a city, and WAN covers a large geographical area. The Internet is an example of WAN.

5. Explain Multiplexing.
Multiplexing combines multiple data signals and transmits them through a single communication channel. It is performed by a multiplexer.

6. Explain Demultiplexing.
Demultiplexing separates combined data signals at the receiving end. It is performed by a demultiplexer.

7. Functions of Internet Service Providers (ISPs).
ISPs provide Internet connectivity, IP addresses, and technical support. Examples include Jio, Airtel, and BSNL.

8. Role of Routers and Switches.
A router connects different networks and forwards packets using IP addresses. A switch connects devices within a LAN using MAC addresses.

9. Functions of Transport Layer.
The transport layer provides end-to-end communication between applications. Its functions include segmentation, flow control, error control, and port addressing.

10. What is a Socket Address?
A socket address identifies a communication endpoint using an IP address and port number. Example: 192.168.1.10:8080.

11. What is Error Control?
Error control detects and handles lost or corrupted data during transmission. Its techniques include acknowledgements, sequence numbers, and retransmission.

12. What is an Acknowledgement?
An acknowledgement (ACK) is a message sent by the receiver to confirm data reception. It helps the sender determine whether data was received successfully.

13. What is Go-Back-N Protocol?
Go-Back-N is a sliding window protocol that retransmits the lost or damaged frame and subsequent frames in the sequence. It provides reliable data transmission.

14. What is Selective Repeat Protocol?
Selective Repeat retransmits only the lost or damaged frames. It is more efficient than Go-Back-N because it avoids unnecessary retransmissions.

15. Major functions of TCP.
TCP provides reliable, connection-oriented communication between devices. Its functions include error control, flow control, sequencing, acknowledgements, and congestion control.

16. Explain Sliding Window Protocol.
The sliding window protocol allows multiple frames to be sent before receiving all acknowledgements. It improves transmission efficiency and supports flow control.

17. What is Piggybacking in Bidirectional Protocols?
Piggybacking attaches an acknowledgement to an outgoing data frame instead of sending it separately. It reduces the number of frames transmitted.

18. What is a Sequence Number?
A sequence number identifies the position of a data segment or frame in a sequence. It helps arrange data correctly and detect missing or duplicate data.

19. Primary responsibility of the Transport Layer.
The transport layer provides end-to-end communication between application processes on different devices. It may also provide reliable delivery and flow control.

20. What is a Port Number? State its range and categories.
A port number identifies an application or service and ranges from 0 to 65535. Categories are well-known (0–1023), registered (1024–49151), and dynamic/private (49152–65535).


</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
