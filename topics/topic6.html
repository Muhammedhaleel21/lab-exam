<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int absvalue(int x){
	if(x < 0)
		return -x;
	return x;
}

void copyArray(int dest[], int src[], int n){
	for(int i=0; i<n; i++){
		dest[i] = src[i];
	}
}

void sortArray(int arr[], int n){
	for(int i=0; i<n-1; i++){
		for(int j=0; j<n-i-1; j++){
			if(arr[j] > arr[j+1]){
				int temp = arr[j];
				arr[j] = arr[j+1];
				arr[j+1] = temp;
			}
		}
	}
}

int cscan(int req[], int n, int head){
	int arr[10];
	copyArray(arr, req, n);
	sortArray(arr, n);

	int total = 0;
	int i;

	for(i=0; i<n; i++){
		if(arr[i] > head){
			break;
		}
	}

	for(int j=i; j<n; j++){
		total += absvalue(head - arr[j]);
		head = arr[j];
	}
	
	total += absvalue(head - 4999);

	head = 0;
	total += 4999;

	for(int j=0; j<i; j++){
		total += absvalue(head - arr[j]);
		head = arr[j];
	}

	return total;
}

int main(int argc, char *argv[]){
	if(argc != 2){
		printf("Usage: %s <initial head>\n", argv[0]);
	}
	
	int head = atoi(argv[1]);
	int req[10];
	srand(time(NULL));

	printf("Disk Requests:\n");
	for(int i=0; i<10; i++){
		req[i] = rand() % 5000;
		printf("%d ", req[i]);
	}

	printf("\nC-SCAN Head Movement = %d\n", cscan(req, 10, head));
	
	return 0;
}</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
