<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">
    
//client.c
#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <unistd.h>
#include <arpa/inet.h>

#define PORT 8080
#define BUFFER_SIZE 1024

int main()
{
    int server_fd, client_socket;
    struct sockaddr_in server_addr, client_addr;
    socklen_t addr_len;
    char filename[100];
    char buffer[BUFFER_SIZE];

    server_fd = socket(AF_INET, SOCK_STREAM, 0);

    server_addr.sin_family = AF_INET;
    server_addr.sin_addr.s_addr = INADDR_ANY;
    server_addr.sin_port = htons(PORT);

    bind(server_fd, (struct sockaddr *)&server_addr, sizeof(server_addr));
    listen(server_fd, 5);

    printf("File Server Running...\n");

    while(1)
    {
        addr_len = sizeof(client_addr);

        client_socket = accept(server_fd, (struct sockaddr *)&client_addr, &addr_len);

        if(fork() == 0)
        {
            close(server_fd);

            recv(client_socket, filename, sizeof(filename), 0);

            FILE *fp = fopen(filename, "r");

            sprintf(buffer, "Server PID: %d\n\n", getpid());
            send(client_socket, buffer, strlen(buffer), 0);

            if(fp == NULL)
            {
                strcpy(buffer, "Requested file does not exist.\n");
                send(client_socket, buffer, strlen(buffer), 0);
            }
            else
            {
                while(fgets(buffer, BUFFER_SIZE, fp) != NULL)
                {
                    send(client_socket, buffer, strlen(buffer), 0);
                }

                fclose(fp);
            }

            close(client_socket);
            exit(0);
        }

        close(client_socket);
    }

    return 0;
}


//server.c
#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <unistd.h>
#include <arpa/inet.h>

#define PORT 8080
#define BUFFER_SIZE 1024

int main()
{
    int sockfd;
    struct sockaddr_in server_addr;
    char filename[100];
    char buffer[BUFFER_SIZE];

    sockfd = socket(AF_INET, SOCK_STREAM, 0);

    server_addr.sin_family = AF_INET;
    server_addr.sin_port = htons(PORT);
    server_addr.sin_addr.s_addr = inet_addr("127.0.0.1");

    connect(sockfd, (struct sockaddr *)&server_addr, sizeof(server_addr));

    printf("Enter filename: ");
    scanf("%s", filename);

    send(sockfd, filename, strlen(filename) + 1, 0);

    printf("\nResponse from Server:\n\n");

    while(recv(sockfd, buffer, BUFFER_SIZE - 1, 0) > 0)
    {
        buffer[BUFFER_SIZE - 1] = '\0';
        printf("%s", buffer);
    }

    close(sockfd);

    return 0;
}



  </script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
