<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">
    
from sklearn.neighbors import KNeighborsClassifier
from sklearn.metrics import accuracy_score
import pandas as pd

# 1. Load Training and Testing datasets
train_data = pd.read_csv(r"D:\B.Tech ML LAB\fashion mnist\fashion-mnist_train.csv")
test_data = pd.read_csv(r"D:\B.Tech ML LAB\fashion mnist\fashion-mnist_test.csv")

# 2. Separate features (X) and target (y)
X_train = train_data.drop("label", axis=1)
y_train = train_data["label"]

X_test = test_data.drop("label", axis=1)
y_test = test_data["label"]

# 3. Use a small sample for faster execution
X_train = X_train.iloc[:5000]
y_train = y_train.iloc[:5000]

X_test = X_test.iloc[:1000]
y_test = y_test.iloc[:1000]

# 4. Normalize pixel values
X_train = X_train / 255.0
X_test = X_test / 255.0

# 5. Experiment with different values of K
for k in [3, 7, 15]:
    knn = KNeighborsClassifier(n_neighbors=k)

    # Train the KNN classifier
    knn.fit(X_train, y_train)

    # Predict test samples
    pred = knn.predict(X_test)

    # Calculate accuracy
    accuracy = accuracy_score(y_test, pred)

    print(f"K={k} Accuracy: {accuracy:.2f}")
  
  </script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
