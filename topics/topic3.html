  <script type="text/plain" id="raw-code">#include <stdio.h>

struct Process {
    int pid, at, bt, priority;
};

float PriorityScheduling(struct Process p[], int n) {

    int completed[n];

    int time = 0, done = 0;

    float totalWT = 0;

    for(int i = 0; i < n; i++) {
        completed[i] = 0;
    }

    while(done < n) {

        int idx = -1;

        int highest = -1;

        for(int i = 0; i < n; i++) {

            if(!completed[i] &&
               p[i].at <= time &&
               p[i].priority > highest) {

                highest = p[i].priority;
                idx = i;
            }
        }

        if(idx == -1) {
            time++;
            continue;
        }

        int wt = time - p[idx].at;

        totalWT += wt;

        time += p[idx].bt;

        completed[idx] = 1;

        done++;
    }

    return totalWT / n;
}

int main() {

    int n;

    printf("Enter number of processes: ");
    scanf("%d", &n);

    struct Process p[n];

    for(int i = 0; i < n; i++) {

        p[i].pid = i + 1;

        printf("\nProcess P%d\n", i + 1);

        printf("Arrival Time: ");
        scanf("%d", &p[i].at);

        printf("Burst Time: ");
        scanf("%d", &p[i].bt);

        printf("Priority: ");
        scanf("%d", &p[i].priority);
    }

    float avgWT = PriorityScheduling(p, n);

    printf("\nAverage Waiting Time = %.2f\n", avgWT);

    return 0;
}</script>
