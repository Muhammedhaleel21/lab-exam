<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <ctype.h>
#include <sys/ipc.h>
#include <sys/shm.h>
#include <sys/types.h>
#include <sys/wait.h>
#include <unistd.h>

#define SHM_SIZE 1024

int main() {

    int shmid;

    char *shm;

    key_t key = IPC_PRIVATE;

    shmid = shmget(key, SHM_SIZE, IPC_CREAT | 0666);

    if(shmid < 0) {
        perror("shmget");
        exit(1);
    }

    shm = (char *)shmat(shmid, NULL, 0);

    if(shm == (char *) -1) {
        perror("shmat");
        exit(1);
    }

    if(fork() == 0) {

        char s1[100], s2[100], s3[100], result[300];

        sscanf(shm, "%s %s %s", s1, s2, s3);

        sprintf(result, "%s %s %s", s1, s2, s3);

        strcpy(shm, result);

        exit(0);
    }

    else {

        char final[300];

        sprintf(shm, "Hello S4 Students");

        wait(NULL);

        strcpy(final, shm);

        for(int i = 0; final[i] != '\0'; i++) {

            if(islower(final[i]))
                final[i] = toupper(final[i]);

            else if(isupper(final[i]))
                final[i] = tolower(final[i]);
        }

        printf("Final Output: %s\n", final);

        shmdt(shm);

        shmctl(shmid, IPC_RMID, NULL);
    }

    return 0;
}</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
