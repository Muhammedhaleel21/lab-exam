<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">
    
    
ALGORITHM

Naive Bayes Classification (Multinomial and Bernoulli)

Step 1: Start the program.

Step 2: Import the required libraries:

Import Pandas as pd.

Import train_test_split from sklearn.model_selection.

Import CountVectorizer from sklearn.feature_extraction.text.

Import MultinomialNB and BernoulliNB from sklearn.naive_bayes.

Import accuracy_score and f1_score from sklearn.metrics.


Step 3: Load the dataset using Pandas.

data = pd.read_csv("20NewsGroups.csv")

Step 4: Select the required categories:

sci.space

rec.autos


Step 5: Filter the dataset to select only the above categories using isin().

Step 6: Separate the dataset into input features and target labels.

X = text

y = category


Step 7: Split the dataset into training and testing sets using train_test_split().

80% for training.

20% for testing.

Set random_state=9.


Step 8: Create a Multinomial CountVectorizer using CountVectorizer().

Step 9: Apply fit_transform() to the training data to learn the vocabulary and convert text into numerical features.

Step 10: Apply transform() to the testing data using the learned vocabulary.

Step 11: Create a Bernoulli CountVectorizer using CountVectorizer(binary=True) to convert word frequencies into binary values (0 and 1).

Step 12: Apply fit_transform() to the Bernoulli training data and transform() to the testing data.

Step 13: Train the Multinomial Naive Bayes model using MultinomialNB().fit() with the Multinomial training data and labels.

Step 14: Train the Bernoulli Naive Bayes model using BernoulliNB().fit() with the Bernoulli training data and labels.

Step 15: Predict the testing data using the predict() function for both models.

Step 16: Calculate the accuracy of the Multinomial and Bernoulli models using accuracy_score().

Step 17: Calculate the F1-score of both models using f1_score() with average='weighted'.

Step 18: Display the accuracy and F1-score of both models using print().

Step 19: Stop the program.

</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
