<!DOCTYPE html>

<body>
  <pre><code id="code-display"></code></pre>

  <script type="text/plain" id="raw-code">#include <stdio.h>
#include <stdlib.h>
#include <time.h>

int fifo(int ref[], int n, int frames){
	int f[10], faults=0, k=0;

	for(int i=0; i<frames; i++){
		f[i] = -1;
	}

	for(int i=0; i<n; i++){
		int found = 0;

		for(int j=0; j<frames; j++){
			if(f[j] == ref[i]){
				found = 1;
				break;
			}
		}
		
		if(!found){
			f[k] = ref[i];
			k = (k+1) % frames;
			faults++;
		}
	}

	return faults;
}

int main(int argc, char *argv[]){
	if(argc != 3){
		printf("Usage: %s <length> <frames>", argv[0]);
		return 0;
	}

	int n = atoi(argv[1]);
	int frames = atoi(argv[2]);

	int ref[100];
	srand(time(NULL));

	printf("Reference String:\n");
	for(int i=0; i<n; i++){
		ref[i] = rand() % 10;
		printf("%d ", ref[i]);
	}

	printf("\nFIFO faults: %d", fifo(ref, n, frames));

	return 0;
}</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();
  </script>
</body>
