Algorithm – KNN (K-Nearest Neighbors)

1. Start the program.


2. Import the required libraries:

pandas for loading and handling the dataset.

KNeighborsClassifier for implementing the KNN algorithm.

accuracy_score for calculating the accuracy.



3. Load the Fashion MNIST training dataset and testing dataset using pd.read_csv().


4. Separate the input features and target labels:

X_train = train_data.drop("label", axis=1) – Removes the label column from the training dataset and stores the remaining pixel values as input features.

y_train = train_data["label"] – Selects the label column as the target variable for training.

X_test = test_data.drop("label", axis=1) – Removes the label column from the testing dataset and stores the pixel values as test features.

y_test = test_data["label"] – Selects the actual labels of the testing images.


Here, axis=1 means column-wise operation.


5. Select the first 5000 images for training and the first 1000 images for testing using iloc[].


6. Normalize the pixel values by dividing both training and testing data by 255.0. This converts pixel values from 0–255 into 0–1.


7. Select different values of K (3, 7 and 5) using a for loop.


8. Create a KNN classifier using KNeighborsClassifier(n_neighbors=k).


9. Train the KNN model using fit() with training features and training labels.


10. Predict the labels of test images using predict().


11. Calculate the accuracy by comparing the actual labels with the predicted labels using accuracy_score().


12. Display the K value and corresponding accuracy using the print() statement.


13. Repeat the process for all selected K values.


14. Stop the program.



</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
