<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>

<body>
  <pre><code id="code-display"></code></pre>

  <script type="text/plain" id="raw-code">#include <stdio.h>
#include <string.h>
#include <sys/ipc.h>
#include <sys/msg.h>

#define MSGKEY 1234

struct msg{
	long type;
	char text[100];
};

int main(){
	struct msg m1, m2;

	int qid;
	qid = msgget(MSGKEY, IPC_CREAT | 0666);

	printf("Enter a string:");
	scanf("%s", m1.text);
	m1.type = 1;

	msgsnd(qid, &m1, sizeof(m1.text), 0);

	msgrcv(qid, &m2, sizeof(m2.text), 2, 0);

	printf("Reversed string received: %s", m2.text);
	
	if(strcmp(m1.text, m2.text) == 0){
		printf("\nPalindrome\n");
	}else{
		printf("\nNot Palindrome\n");
	}

	msgctl(qid, IPC_RMID, NULL);

	return 0;
}
	</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();
  </script>
</body>

</html>
