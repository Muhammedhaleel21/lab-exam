<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">

	
//server.c
#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <unistd.h>
#include <arpa/inet.h>

#define PORT 8080
#define MAX 20

int main()
{
    int sockfd;
    int r, c;
    int a[MAX][MAX], b[MAX][MAX], sum[MAX][MAX];
    struct sockaddr_in server_addr, client_addr;
    socklen_t len = sizeof(client_addr);

    sockfd = socket(AF_INET, SOCK_DGRAM, 0);

    server_addr.sin_family = AF_INET;
    server_addr.sin_addr.s_addr = INADDR_ANY;
    server_addr.sin_port = htons(PORT);

    bind(sockfd, (struct sockaddr *)&server_addr, sizeof(server_addr));

    printf("UDP Server Running...\n");

    recvfrom(sockfd, &r, sizeof(r), 0,
             (struct sockaddr *)&client_addr, &len);

    recvfrom(sockfd, &c, sizeof(c), 0,
             (struct sockaddr *)&client_addr, &len);

    recvfrom(sockfd, a, r * c * sizeof(int), 0,
             (struct sockaddr *)&client_addr, &len);

    recvfrom(sockfd, b, r * c * sizeof(int), 0,
             (struct sockaddr *)&client_addr, &len);

    printf("Received Matrix A:\n");

    for(int i = 0; i < r; i++)
    {
        for(int j = 0; j < c; j++)
        {
            printf("%d ", a[i][j]);
        }
        printf("\n");
    }

    printf("Received Matrix B:\n");

    for(int i = 0; i < r; i++)
    {
        for(int j = 0; j < c; j++)
        {
            printf("%d ", b[i][j]);
            sum[i][j] = a[i][j] + b[i][j];
        }
        printf("\n");
    }

    sendto(sockfd, sum, r * c * sizeof(int), 0,
           (struct sockaddr *)&client_addr, len);

    printf("Matrix Addition Result Sent.\n");

    close(sockfd);

    return 0;
}

//client.c

#include <stdio.h>
#include <stdlib.h>
#include <string.h>
#include <unistd.h>
#include <arpa/inet.h>

#define PORT 8080
#define MAX 20

int main()
{
    int sockfd;
    int r, c;
    int a[MAX][MAX], b[MAX][MAX], sum[MAX][MAX];
    struct sockaddr_in server_addr;
    socklen_t len = sizeof(server_addr);

    sockfd = socket(AF_INET, SOCK_DGRAM, 0);

    server_addr.sin_family = AF_INET;
    server_addr.sin_port = htons(PORT);
    server_addr.sin_addr.s_addr = inet_addr("127.0.0.1");

    printf("Enter number of rows and columns:\n");
    scanf("%d%d", &r, &c);

    printf("Enter Matrix A:\n");

    for(int i = 0; i < r; i++)
    {
        for(int j = 0; j < c; j++)
        {
            scanf("%d", &a[i][j]);
        }
    }

    printf("Enter Matrix B:\n");

    for(int i = 0; i < r; i++)
    {
        for(int j = 0; j < c; j++)
        {
            scanf("%d", &b[i][j]);
        }
    }

    sendto(sockfd, &r, sizeof(r), 0,
           (struct sockaddr *)&server_addr, len);

    sendto(sockfd, &c, sizeof(c), 0,
           (struct sockaddr *)&server_addr, len);

    sendto(sockfd, a, r * c * sizeof(int), 0,
           (struct sockaddr *)&server_addr, len);

    sendto(sockfd, b, r * c * sizeof(int), 0,
           (struct sockaddr *)&server_addr, len);

    recvfrom(sockfd, sum, r * c * sizeof(int), 0,
             (struct sockaddr *)&server_addr, &len);

    printf("\nMatrix Addition Result:\n");

    for(int i = 0; i < r; i++)
    {
        for(int j = 0; j < c; j++)
        {
            printf("%d\t", sum[i][j]);
        }
        printf("\n");
    }

    close(sockfd);

    return 0;
}



</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
