<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">
    
//server.c
#include <stdio.h>
#include <string.h>
#include <ctype.h>
#include <unistd.h>
#include <arpa/inet.h>

#define PORT 8080
#define MAX 1024

void translate(char *str)
{
    char temp[MAX];
    char result[MAX] = "";
    char *token;

    strcpy(temp, str);

    token = strtok(temp, " ,.!?\n");

    while(token != NULL)
    {
        char word[50];

        strcpy(word, token);

        // Convert token to lowercase
        for(int i = 0; word[i]; i++)
            word[i] = tolower(word[i]);

        if(strcmp(word, "tbh") == 0)
            strcat(result, "to be honest");
        else if(strcmp(word, "idc") == 0)
            strcat(result, "I don't care");
        else if(strcmp(word, "ig") == 0)
            strcat(result, "I guess");
        else if(strcmp(word, "tbf") == 0)
            strcat(result, "to be fair");
        else if(strcmp(word, "atm") == 0)
            strcat(result, "at the moment");
        else if(strcmp(word, "irl") == 0)
            strcat(result, "in real life");
        else if(strcmp(word, "lol") == 0)
            strcat(result, "laughing out loud");
        else if(strcmp(word, "asap") == 0)
            strcat(result, "as soon as possible");
        else if(strcmp(word, "omg") == 0)
            strcat(result, "oh my God");
        else if(strcmp(word, "ttyl") == 0)
            strcat(result, "talk to you later");
        else if(strcmp(word, "idk") == 0)
            strcat(result, "I don't know");
        else if(strcmp(word, "nvm") == 0)
            strcat(result, "never mind");
        else
            strcat(result, token);

        strcat(result, " ");

        token = strtok(NULL, " ,.!?\n");
    }

    strcpy(str, result);
}

int main()
{
    int sockfd;
    char buffer[MAX];
    struct sockaddr_in server_addr, client_addr;
    socklen_t len = sizeof(client_addr);

    sockfd = socket(AF_INET, SOCK_DGRAM, 0);

    server_addr.sin_family = AF_INET;
    server_addr.sin_addr.s_addr = INADDR_ANY;
    server_addr.sin_port = htons(PORT);

    bind(sockfd, (struct sockaddr *)&server_addr, sizeof(server_addr));

    printf("UDP Server Running...\n");

    recvfrom(sockfd, buffer, MAX, 0,
             (struct sockaddr *)&client_addr, &len);

    printf("Received: %s\n", buffer);

    translate(buffer);

    sendto(sockfd, buffer, strlen(buffer) + 1, 0,
           (struct sockaddr *)&client_addr, len);

    printf("Translated message sent.\n");

    close(sockfd);

    return 0;
}


//client.c
#include <stdio.h>
#include <string.h>
#include <unistd.h>
#include <arpa/inet.h>

#define PORT 8080
#define MAX 1024

int main()
{
    int sockfd;
    char message[MAX];
    char buffer[MAX];
    struct sockaddr_in server_addr;
    socklen_t len = sizeof(server_addr);

    sockfd = socket(AF_INET, SOCK_DGRAM, 0);

    server_addr.sin_family = AF_INET;
    server_addr.sin_port = htons(PORT);
    server_addr.sin_addr.s_addr = INADDR_ANY;

    printf("Enter sentence:\n");
    fgets(message, MAX, stdin);

    sendto(sockfd, message, strlen(message)+1, 0,
           (struct sockaddr *)&server_addr, len);

    recvfrom(sockfd, buffer, MAX, 0,
             (struct sockaddr *)&server_addr, &len);

    printf("\nTranslated Sentence:\n%s\n", buffer);

    close(sockfd);

    return 0;
}




</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
