<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>
<body>
  <div class="code-container">
    <button class="copy-btn" onclick="copyCode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy</span>
    </button>
    <pre><code id="code-display"></code></pre>
  </div>

  <script type="text/plain" id="raw-code">#include <stdio.h>

int main(){
	int n, m;

	printf("Enter number of processes:");
	scanf("%d", &n);

	printf("Enter number of resources:");
	scanf("%d", &m);

	int allocation[10][10];
	int max[10][10];
	int need[10][10];
	int available[10];

	int finish[10] = {0};
	int safeSeq[10];
	int work[10];

	int count = 0;

	printf("\nEnter the allocation matrix:\n");
	for(int i=0; i<n; i++){
		for(int j=0; j<m; j++){
			scanf("%d", &allocation[i][j]);
		}
	}

	printf("\nEnter the max matrix:\n");
	for(int i=0; i<n; i++){
		for(int j=0; j<m; j++){
			scanf("%d", &max[i][j]);
		}
	}

	printf("\nEnter available matrix:\n");
	for(int i=0; i<m; i++){
		scanf("%d", &available[i]);
	}


	for(int i=0; i<n; i++){
		for(int j=0; j<m; j++){
			need[i][j] = max[i][j] - allocation[i][j];
		}
	}

	for(int i=0; i<m; i++){
		work[i] = available[i];
	}

	while(count < n){
		int found = 0;
	
		for(int i=0; i<n; i++){
			if(finish[i] == 0){
			
				int j;
				for(j=0; j<m; j++){
					if(need[i][j] > work[j]){
						break;
					}
				}

				if(j == m){
					for(int k=0; k<m; k++){
						work[k] += allocation[i][k];
					}

					safeSeq[count] = i;
					count++;

					finish[i] = 1;
					found = 1;
				}
			}
		}

		if(found == 0){
			break;
		}
	}

	if(count == n){
		printf("System is in SAFE state");
		
		printf("\nSafe Sequence: ");
		for(int i=0; i<n; i++){
			printf("P%d ", safeSeq[i]);
		}
		printf("\n");
	}else{
		printf("System is NOT in safe state");
	}

	return 0;
}</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();

    function copyCode() {
      const code = document.getElementById('code-display').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.copy-btn');
        const origHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = origHTML;
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>
</body>
</html>
