<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="topic-styles.css">
</head>

<body>
  <pre><code id="code-display"></code></pre>

  <script type="text/plain" id="raw-code">#include <stdio.h>
#include <string.h>
#include <sys/ipc.h>
#include <sys/msg.h>

#define MSGKEY 1234

struct msg{
	long type;
	char text[100];
};

void reverse(char *s){
	int l = 0;
	int r = strlen(s) - 1;

	while(l<r){
		char temp = s[l];
		s[l] = s[r];
		s[r] = temp;

		l++;
		r--;
	}
}

int main(){
	struct msg m1, m2;

	int qid;
	qid = msgget(MSGKEY, IPC_CREAT | 0666);

	msgrcv(qid, &m1, sizeof(m1.text), 1, 0);

	reverse(m1.text);

	m2.type = 2;

	strcpy(m2.text, m1.text);

	msgsnd(qid, &m2, sizeof(m2.text), 0);

	return 0;
}</script>

  <script>
    const rawCode = document.getElementById('raw-code').textContent;
    document.getElementById('code-display').textContent = rawCode.trim();
  </script>
</body>

</html>
